---
- name: Instalar Docker no node2
  hosts: node2
  become: true

  tasks:
    - name: Atualizar cache de pacotes
      apt:
        update_cache: true

    - name: Instalar dependências do Docker
      apt:
        name:
          - ca-certificates
          - curl
          - gnupg
        state: present

    - name: Criar diretório para chaves APT
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Adicionar chave GPG oficial do Docker
      shell: >
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg |
        gpg --dearmor -o /etc/apt/keyrings/docker.gpg
      args:
        creates: /etc/apt/keyrings/docker.gpg

    - name: Adicionar repositório do Docker
      shell: >
        echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg]
        https://download.docker.com/linux/ubuntu
        $(lsb_release -cs) stable" > /etc/apt/sources.list.d/docker.list
      args:
        creates: /etc/apt/sources.list.d/docker.list

    - name: Atualizar cache após adicionar repositório
      apt:
        update_cache: true

    - name: Instalar Docker Engine
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        state: present

    - name: Iniciar e habilitar o serviço Docker
      service:
        name: docker
        state: started
        enabled: true

    - name: Adicionar usuário vagrant ao grupo docker
      user:
        name: vagrant
        groups: docker
        append: true

    - name: Instalar SDK Docker para Python
      apt:
        name: python3-docker
        state: present

    - name: Garantir container Nginx em execução
      community.docker.docker_container:
        name: nginx-lab
        image: nginx
        state: started
        published_ports:
          - "80:80"
